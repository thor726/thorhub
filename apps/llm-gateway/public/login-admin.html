<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Login Admin — ThorHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />
  <!-- PWA & ikon -->
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ThorHub" />

  <!-- Pratinjau saat dibagikan -->
  <meta name="description" content="Masuk ke panel admin ThorHub." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ThorHub" />
  <meta property="og:title" content="Login Admin — ThorHub" />
  <meta property="og:description" content="Masuk ke panel admin ThorHub." />
  <meta property="og:image" content="https://llm.thormarket.site/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Login Admin — ThorHub" />
  <meta name="twitter:description" content="Masuk ke panel admin ThorHub." />
  <meta name="twitter:image" content="https://llm.thormarket.site/icon-512.png" />
  <link rel="stylesheet" href="/style.css?v=20261110r" />
</head>
<body class="cc-bg">
  <!-- Latar bertema ThorHub (hub + kilat) digambar oleh bg.js -->
  <script src="/bg.js?v=20261110r"></script>
  <script src="/muncul.js?v=20261110r"></script>
  <header class="topbar">
    <a class="brand" href="/">
      <img class="logo" src="/logo.svg" alt="" width="30" height="30" />
      <span class="txt">Thor<em>Hub</em></span>
    </a>
    <button class="nav-toggle" aria-label="Buka menu" aria-expanded="false" aria-controls="main-nav">
      <span class="icon-open">☰</span>
      <span class="icon-close">✕</span>
    </button>
    <nav id="main-nav">
      <a href="/">
        <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Beranda
      </a>
      <a href="/docs">
        <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Dokumentasi
      </a>
      <a href="/portal">
        <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Portal Member
      </a>
    </nav>
  </header>

  <main class="wrap narrow">
    <!-- Breadcrumb ala Thor-market: jejak klik dengan pemisah "/" -->
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="/">Beranda</a>
      <span class="bc-sep" aria-hidden="true">/</span>
      <a href="/admin">Panel Admin</a>
      <span class="bc-sep" aria-hidden="true">/</span>
      <span class="bc-now" aria-current="page">Masuk</span>
    </nav>
    <div class="card">
      <h1>
        <svg class="ico" style="width:28px;height:28px;color:var(--lime)" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg>
        <span>Panel <span class="grad">Admin</span></span>
      </h1>
      <p class="sub">Masuk dengan password admin untuk mengelola API Key.</p>

      <form id="form">
        <label for="password">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Password Admin
        </label>
        <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
        <div class="row-actions">
          <button class="btn primary w-full" type="submit" id="btn">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
            Masuk
          </button>
        </div>
      </form>
      <div id="msg"></div>
    </div>
  </main>

  <script defer src="/nav.js?v=20261110r"></script>
  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    fetch("/portal/admin/me").then(r => { if (r.ok) location.href = "/admin"; }).catch(() => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.innerHTML = "";
      btn.disabled = true;
      btn.classList.add("loading");
      try {
        const r = await fetch("/portal/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("password").value }),
        });
        const d = await r.json();
        if (!r.ok) {
          msg.innerHTML = `<div class="alert err">${d.error?.message || "Login gagal."}</div>`;
        } else {
          location.href = "/admin";
        }
      } catch (err) {
        msg.innerHTML = `<div class="alert err">Gagal menghubungi server.</div>`;
      } finally {
        btn.disabled = false;
        btn.classList.remove("loading");
      }
    });
  </script>
</body>
</html>
