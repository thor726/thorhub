<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080b13" />
  <title>Panel Admin — ThorHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <img class="logo" src="/logo.svg" alt="" width="30" height="30" />
      <span class="txt">Thor<em>Hub</em></span>
      <span class="suffix">· Admin</span>
    </a>
    <button class="nav-toggle" aria-label="Buka menu" aria-expanded="false" aria-controls="main-nav">
      <span class="icon-open">☰</span>
      <span class="icon-close">✕</span>
    </button>
    <nav id="main-nav">
      <a href="/">Beranda</a>
      <a href="/docs">Dokumentasi</a>
      <a href="/portal">Portal Member</a>
      <a href="#" id="btn-logout" class="hidden">Keluar</a>
    </nav>
  </header>

  <main class="wrap">
    <div id="loading" class="card center"><p class="muted">Memuat…</p></div>

    <!-- SECTION LOGIN -->
    <div id="login-section" class="hidden">
      <div class="narrow card" style="margin:0 auto">
        <h1>Panel <span class="grad">Admin</span></h1>
        <p class="sub">Masuk dengan password admin untuk mengelola sub-API key.</p>
        <form id="form-login">
          <label for="password">Password Admin</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          <div class="row-actions">
            <button class="btn primary w-full" type="submit" id="btn-login">Masuk</button>
          </div>
        </form>
        <div id="login-msg"></div>
      </div>
    </div>

    <!-- SECTION PANEL -->
    <div id="panel" class="hidden">
      <h1>Panel <span class="grad">Admin</span></h1>
      <p class="sub">Kelola sub-API key, kuota token, dan pantau pemakaian.</p>

      <div class="grid" id="stats"></div>

      <div class="card mt-4">
        <h2>Status Gateway</h2>
        <div class="grid" id="gw-status"></div>
      </div>

      <div class="card">
        <h2>Terbitkan Sub-API Key Baru</h2>
        <form id="form-create">
          <div class="grid-2">
            <div>
              <label for="new-name">Nama Member</label>
              <input id="new-name" placeholder="cth: Budi Santoso" required />
            </div>
            <div>
              <label for="new-limit">Limit Token</label>
              <input id="new-limit" type="number" min="1" placeholder="cth: 1000000" required />
            </div>
          </div>
          <div class="row-actions">
            <button class="btn primary" type="submit" id="btn-create">Terbitkan Key</button>
          </div>
        </form>
        <div id="create-result"></div>
      </div>

      <div class="card">
        <h2>Daftar Sub-API Key</h2>
        <div class="row-actions" style="margin-top:0;margin-bottom:12px">
          <button class="btn small" id="btn-refresh">Muat Ulang</button>
        </div>
        <div id="keys-wrap"><p class="muted">Memuat…</p></div>
      </div>
    </div>
  </main>

  <script defer src="/nav.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
