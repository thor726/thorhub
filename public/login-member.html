<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Login Member — ThorHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />
  <!-- PWA & ikon -->
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ThorHub" />

  <!-- Pratinjau saat dibagikan -->
  <meta name="description" content="Masuk ke portal member ThorHub." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ThorHub" />
  <meta property="og:title" content="Login Member — ThorHub" />
  <meta property="og:description" content="Masuk ke portal member ThorHub." />
  <meta property="og:image" content="https://llm.thormarket.site/icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Login Member — ThorHub" />
  <meta name="twitter:description" content="Masuk ke portal member ThorHub." />
  <meta name="twitter:image" content="https://llm.thormarket.site/icon-512.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="cc-aurora">
  <!-- AURORA — lapisan latar bergerak (gaya clariohub) -->
  <svg class="cc-aurora-svg" aria-hidden="true" focusable="false" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="cc-aurora-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="6"/></filter>
      <filter id="cc-aurora-ribbon-blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
      <linearGradient id="cc-aurora-ribbon-lime" x1="0" y1="0" x2="1" y2=".3"><stop stop-color="var(--aurora-lime)" stop-opacity="0"/><stop offset=".5" stop-color="var(--aurora-lime)"/><stop offset="1" stop-color="var(--aurora-blue)" stop-opacity="0"/></linearGradient>
      <linearGradient id="cc-aurora-ribbon-violet" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="var(--aurora-blue)" stop-opacity="0"/><stop offset=".5" stop-color="var(--aurora-violet)"/><stop offset="1" stop-color="var(--aurora-violet)" stop-opacity="0"/></linearGradient>
      <radialGradient id="cc-aurora-top-glow"><stop stop-color="var(--aurora-blue)" stop-opacity="var(--aurora-ellipse-opacity)"/><stop offset="1" stop-color="var(--aurora-violet)" stop-opacity="0"/></radialGradient>
      <g id="cc-aurora-curves" fill="none">
        <path d="M-50 800 C300 700 200 400 600 450 S1100 200 1500 300" stroke="var(--aurora-lime)"/>
        <path d="M-80 350 C180 50 490 160 520 390 S980 810 1510 510" stroke="var(--aurora-blue)"/>
        <path d="M-60 590 C260 920 430 570 780 610 S1050 20 1500 140" stroke="var(--aurora-violet)"/>
      </g>
    </defs>
    <ellipse cx="760" cy="20" rx="680" ry="320" fill="url(#cc-aurora-top-glow)"/>
    <g opacity="var(--aurora-ribbon-opacity)" filter="url(#cc-aurora-ribbon-blur)">
      <path d="M180 -100 C700 50 160 360 560 510 S780 770 640 1000 L950 1000 C1060 680 670 530 750 340 S930 0 480 -100 Z" fill="url(#cc-aurora-ribbon-lime)"/>
      <path d="M780 -100 C1250 120 600 340 980 610 S1100 810 970 1000 L1290 1000 C1450 730 1120 520 1150 370 S1550 100 1100 -100 Z" fill="url(#cc-aurora-ribbon-violet)"/>
    </g>
    <g class="cc-aurora-halo"><use href="#cc-aurora-curves" filter="url(#cc-aurora-glow)" stroke-width="1.5"/></g>
    <use class="cc-aurora-sharp" href="#cc-aurora-curves" stroke-width="1"/>
  </svg>
  <header class="topbar">
    <a class="brand" href="/">
      <img class="logo" src="/logo.svg" alt="" width="30" height="30" />
      <span class="txt">Thor<em>Hub</em></span>
    </a>
    <button class="nav-toggle" aria-label="Buka menu" aria-expanded="false" aria-controls="main-nav">
      <span class="icon-open">☰</span>
      <span class="icon-close">✕</span>
    </button>
    <nav id="main-nav">
      <a href="/">
        <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Beranda
      </a>
      <a href="/docs">
        <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        Dokumentasi
      </a>
      <a href="/admin">
        <svg class="ico ico-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg>
        Panel Admin
      </a>
    </nav>
  </header>

  <main class="wrap narrow">
    <div class="card">
      <h1>
        <svg class="ico" style="width:28px;height:28px;color:var(--lime)" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Portal <span class="grad">Member</span></span>
      </h1>
      <p class="sub">Masuk dengan Sub-API Key Anda untuk melihat kuota pemakaian.</p>

      <form id="form">
        <label for="apikey">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 2l-2 2m-7.6 7.6a5 5 0 1 1-7.1 7.1 5 5 0 0 1 7.1-7.1zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3"/></svg>
          Sub-API Key
        </label>
        <input id="apikey" type="password" class="mono" placeholder="sk-thor-..." autocomplete="off" required />
        <div class="row-actions">
          <button class="btn primary w-full" type="submit" id="btn">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
            Masuk
          </button>
        </div>
      </form>
      <div id="msg"></div>
    </div>
  </main>

  <script defer src="/nav.js"></script>
  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");

    fetch("/portal/member/me").then(r => { if (r.ok) location.href = "/portal"; }).catch(() => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.innerHTML = "";
      btn.disabled = true;
      btn.classList.add("loading");
      try {
        const r = await fetch("/portal/member/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ api_key: document.getElementById("apikey").value.trim() }),
        });
        const d = await r.json();
        if (!r.ok) {
          msg.innerHTML = `<div class="alert err">${d.error?.message || "Login gagal."}</div>`;
        } else {
          location.href = "/portal";
        }
      } catch (err) {
        msg.innerHTML = `<div class="alert err">Gagal menghubungi server.</div>`;
      } finally {
        btn.disabled = false;
        btn.classList.remove("loading");
      }
    });
  </script>
</body>
</html>
