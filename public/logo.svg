<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ThorHub logo">
  <defs>
    <linearGradient id="th-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5cff"/>
    </linearGradient>
    <linearGradient id="th-bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="th-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Lingkaran badge -->
  <circle cx="32" cy="32" r="29" fill="#0e1420" stroke="url(#th-g)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#th-g)" stroke-width="0.8" opacity="0.35"/>

  <!-- Petir (kilat Thor) -->
  <path d="M35 11 L20 35 L30 35 L26 53 L45 27 L34 27 Z"
        fill="url(#th-bolt)" stroke="#ffe08a" stroke-width="0.6"
        stroke-linejoin="round" filter="url(#th-glow)"/>
</svg>
