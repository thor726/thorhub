# ==============================================================
# nginx — reverse proxy untuk LLM Proxy Gateway
#
# Pasang:
#   sudo cp deploy/nginx-llm-gateway.conf /etc/nginx/sites-available/llm-gateway
#   sudo ln -s /etc/nginx/sites-available/llm-gateway /etc/nginx/sites-enabled/
#   # Zone limit_req (wajib, taruh di /etc/nginx/conf.d/):
#   sudo cp deploy/nginx-limit-req-zones.conf /etc/nginx/conf.d/limit-req-zones.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d llm.thormarket.site
#
# Ganti "llm.thormarket.site" dengan domain Anda.
#
# KEAMANAN:
#  - limit_req pada endpoint login (anti brute-force) & /v1.
#  - X-Forwarded-For DITIMPA dengan IP klien nyata ($remote_addr) agar penyerang
#    tak bisa memalsukan IP untuk mengelabui pembatas per-IP di aplikasi.
#  - HSTS memaksa HTTPS di browser.
# ==============================================================

server {
    server_name llm.thormarket.site;

    # Ukuran body (prompt panjang)
    client_max_body_size 8m;

    # Endpoint login: batas ketat (anti brute-force). 5 req/menit per IP, burst 3.
    location = /portal/admin/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # TIMPA, jangan tambah
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /portal/member/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # TIMPA, jangan tambah
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # TIMPA, jangan tambah
        proxy_set_header X-Forwarded-Proto $scheme;

        # WAJIB untuk streaming SSE (chat streaming)
        # Tanpa ini, respons streaming akan tertahan dan tidak real-time.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # HSTS: paksa HTTPS di browser (2 tahun).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    listen 443 ssl;              # dikelola Certbot
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate     /etc/letsencrypt/live/llm.thormarket.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.thormarket.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Default: layani akses via IP/localhost (uji internal & fallback)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # TIMPA, jangan tambah
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Redirect HTTP → HTTPS (dikelola Certbot)
server {
    if ($host = llm.thormarket.site) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name llm.thormarket.site;
    return 404;
}
