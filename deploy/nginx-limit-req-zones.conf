# Zone pembatas laju nginx (tempatkan di /etc/nginx/conf.d/limit-req-zones.conf).
# Di-include dari blok http{} nginx.
#  - login_limit : ketat untuk endpoint login (anti brute-force)
#  - api_limit   : longgar untuk /v1 (mencegah penyalahgunaan API key)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_status 429;
